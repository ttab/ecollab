name: Go

on:
  push:
  pull_request:

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build
        run: go build -o /dev/null ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Caret helper dependencies
        run: cd testdata/node && npm ci

      - name: Test
        run: go test -race ./...
